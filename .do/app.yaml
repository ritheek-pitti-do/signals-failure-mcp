name: signals-orders-desk-mcp
region: nyc
services:
  - name: orders-desk
    git:
      repo_clone_url: https://github.com/ritheek-pitti-do/signals-failure-mcp.git
      branch: main
    environment_slug: python
    run_command: uvicorn server:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    envs:
      - key: ERRORS_AS_CONTENT
        value: "0"
        scope: RUN_TIME
